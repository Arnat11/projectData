<!doctype html>
<html lang="th" class="admin-page">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>บัญชีลูกค้า | Airify Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Noto+Sans+Thai:wght@400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/store.css">
    <script src="./account.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#account-main">ข้ามไปที่เนื้อหา</a>
    <header class="topbar">
      <div class="wrap topbar-inner admin-topbar">
        <a class="brand" href="./" aria-label="Airify Store หน้าแรก">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3M2 12h17a3 3 0 1 0-3-3M4 16h9a3 3 0 1 1-3 3"></path></svg>
          <span>Airify <span class="brand-sub">Store</span></span>
        </a>
        <nav aria-label="เมนูบัญชี"><a href="./">กลับหน้าร้าน</a><a href="./admin.html">เข้าสู่ระบบผู้ดูแล</a></nav>
      </div>
    </header>
    <main class="wrap admin-main" id="account-main">
      <section class="login-panel" id="account-panel" aria-labelledby="account-title">
        <h1 id="account-title">เข้าสู่ระบบลูกค้า</h1>
        <p class="muted">เข้าสู่ระบบเพื่อสั่งซื้อและติดตามรายการสั่งซื้อ</p>
        <div class="categories" role="tablist" aria-label="เลือกเข้าสู่ระบบหรือสมัครสมาชิก">
          <button type="button" class="button category-button" id="show-login" role="tab" aria-selected="true">เข้าสู่ระบบ</button>
          <button type="button" class="button category-button" id="show-register" role="tab" aria-selected="false">สมัครสมาชิก</button>
        </div>
        <form class="form-stack" id="login-form">
          <label for="login-username">ชื่อผู้ใช้<input id="login-username" name="username" autocomplete="username" required></label>
          <label for="login-password">รหัสผ่าน<input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
          <button class="button button-primary full" type="submit">เข้าสู่ระบบ</button>
        </form>
        <form class="form-stack" id="register-form" hidden>
          <label for="register-name">ชื่อที่แสดง<input id="register-name" name="displayName" autocomplete="name" required></label>
          <label for="register-username">ชื่อผู้ใช้<input id="register-username" name="username" autocomplete="username" minlength="3" maxlength="32" required></label>
          <label for="register-password">รหัสผ่าน<input id="register-password" name="password" type="password" autocomplete="new-password" minlength="10" required><small>อย่างน้อย 10 ตัวอักษร</small></label>
          <button class="button button-primary full" type="submit">สร้างบัญชีลูกค้า</button>
        </form>
        <p class="notice-inline error" id="account-error" role="alert" hidden></p>
      </section>
      <section class="login-panel" id="account-home" hidden>
        <div class="inventory-head"><div><h1>บัญชีของฉัน</h1><p class="muted" id="account-name"></p></div><button class="button button-quiet" id="logout" type="button">ออกจากระบบ</button></div>
        <div class="orders-section"><h2>รายการสั่งซื้อ</h2><div id="my-orders-list"></div></div>
        <a class="button button-primary full" href="./#catalog">เลือกซื้อสินค้า</a>
      </section>
      <p class="notice-inline error" id="forbidden-message" role="status" hidden>บัญชีลูกค้าไม่มีสิทธิ์เข้าหน้าจัดการร้าน กรุณาเข้าสู่ระบบผู้ดูแล</p>
    </main>
  </body>
</html>
